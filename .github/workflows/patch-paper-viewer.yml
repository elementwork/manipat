name: Temporary Paper Viewer Patch

on:
  push:
    branches:
      - agent/fix-paper-folding-single-step

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-paper-folding-single-step
      - name: Apply canonical paper timeline patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          visualize_path = Path("packages/cli/src/visualize.ts")
          text = visualize_path.read_text()
          text = replace_once(
              text,
              '''  const forward = questionSvgs.map((svg, index) => ({\n    inner: svgInner(svg),\n    label: index === questionSvgs.length - 1 ? "Punch" : `Fold ${index + 1}`,\n  }));''',
              '''  const forward = questionSvgs.map((svg, index) => ({\n    inner: svgInner(svg),\n    label: index === 0 ? "Original" : index === questionSvgs.length - 1 ? "Punch" : `Fold ${index}`,\n  }));''',
              "overview forward labels",
          )
          text = replace_once(
              text,
              '''    const baseSvg = completedFoldCount === 0\n      ? null\n      : question.prompt.stepSvgs[completedFoldCount - 1] ?? null;''',
              '''    const baseSvg = completedFoldCount === 0\n      ? question.prompt.originalSvg\n      : question.prompt.stepSvgs[completedFoldCount - 1] ?? question.prompt.originalSvg;''',
              "reverse original base",
          )
          text = replace_once(
              text,
              '''  const correctChoice = question.choices[question.correctChoiceIndex];\n  if (correctChoice === undefined) throw new Error("Paper question correct choice is missing");\n  const foldAnimations = buildPaperVisualFoldTransitions(question.prompt.folds);\n  return {''',
              '''  const correctChoice = question.choices[question.correctChoiceIndex];\n  if (correctChoice === undefined) throw new Error("Paper question correct choice is missing");\n  const foldAnimations = buildPaperVisualFoldTransitions(question.prompt.folds);\n  const questionSvgs = [question.prompt.originalSvg, ...question.prompt.stepSvgs];\n  return {''',
              "canonical question sequence",
          )
          text = replace_once(
              text,
              '''    overviewSvg: renderPaperOverviewSvg(question.prompt.stepSvgs, steps),\n    questionSvgs: question.prompt.stepSvgs,''',
              '''    overviewSvg: renderPaperOverviewSvg(questionSvgs, steps),\n    questionSvgs,''',
              "payload canonical sequence",
          )
          visualize_path.write_text(text)

          server_path = Path("packages/cli/src/viewer-server.ts")
          text = server_path.read_text()
          text = replace_once(
              text,
              '''const buildPaperFrames = (payload) => {\n  const frames = [{''',
              '''const buildPaperFrames = (payload) => {\n  const expectedQuestionFrameCount = payload.foldAnimations.length + 2;\n  if (payload.questionSvgs.length !== expectedQuestionFrameCount) {\n    throw new Error("Paper timeline requires Original + one frame per fold + Punch");\n  }\n  const frames = [{''',
              "timeline shape guard",
          )
          text = replace_once(
              text,
              '''    svg: blankSheetSvg(),\n    detail: "Begin with the original sheet before the first fold.",''',
              '''    svg: payload.questionSvgs[0] ?? blankSheetSvg(),\n    detail: "Begin with the canonical original sheet before the first fold.",''',
              "canonical original frame",
          )
          text = replace_once(
              text,
              '''  const foldCount = Math.max(0, payload.questionSvgs.length - 1);''',
              '''  const foldCount = payload.foldAnimations.length;''',
              "fold count source",
          )
          text = replace_once(
              text,
              '''      svg: payload.questionSvgs[index] ?? blankSheetSvg(),''',
              '''      svg: payload.questionSvgs[index + 1] ?? blankSheetSvg(),''',
              "fold frame offset",
          )
          server_path.write_text(text)
          PY
      - name: Commit viewer fixes
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cli/src/visualize.ts packages/cli/src/viewer-server.ts
          git commit -m "fix: align paper interactive timeline"
          git push origin HEAD:agent/fix-paper-folding-single-step

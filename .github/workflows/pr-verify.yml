name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Unit and fuzz tests
        run: pnpm test

      # Exercises the worker-thread scheduler as well as full-set assembly.
      - name: Full 90-question offline smoke set
        run: |
          pnpm dat generate set \
            --workers 3 \
            --offline \
            --seed ci-full-set \
            --output ./output/ci-full-set.html
          test -s ./output/ci-full-set.html
          if grep -q 'Answer Key' ./output/ci-full-set.html; then
            echo "Default exam unexpectedly exposed solutions" >&2
            exit 1
          fi

      - name: Printable solutions smoke
        run: |
          pnpm dat generate category angle \
            --count 1 \
            --difficulty 1 \
            --offline \
            --seed ci-solutions \
            --solutions full \
            --output ./output/ci-solutions-full.html
          test -s ./output/ci-solutions-full.html
          grep -q 'Answer Key' ./output/ci-solutions-full.html
          grep -q 'Solutions &amp; Explanations' ./output/ci-solutions-full.html
          grep -q 'Measured angles' ./output/ci-solutions-full.html

      - name: Portable study exam smoke
        run: |
          pnpm dat:view:portable ./output/ci-full-set.html \
            --output ./output/ci-full-set.interactive.html
          test -s ./output/ci-full-set.interactive.html
          grep -q 'name="manipat-viewer-mode" content="portable"' ./output/ci-full-set.interactive.html
          grep -q 'Answer Sheet' ./output/ci-full-set.interactive.html
          grep -q 'manipat-exam-data' ./output/ci-full-set.interactive.html
          grep -q 'Study Tools' ./output/ci-full-set.interactive.html
          grep -q 'Check Answer' ./output/ci-full-set.interactive.html
          grep -q 'Show Explanation' ./output/ci-full-set.interactive.html
          grep -q 'Interactive Hint' ./output/ci-full-set.interactive.html
          if grep -q 'from "/runtime/index.js"' ./output/ci-full-set.interactive.html; then
            echo "Portable study exam retained a development-server runtime import" >&2
            exit 1
          fi

      - name: Hard-band category smoke tests
        run: |
          set -euxo pipefail
          for category in aperture view-recognition angle paper-folding cube-counting form-development; do
            pnpm dat generate category "$category" \
              --count 2 \
              --difficulty 5 \
              --offline \
              --seed "ci-hard-${category}" \
              --output "./output/ci-hard-${category}.html"
            test -s "./output/ci-hard-${category}.html"
          done

      - name: Upload generated HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pat-verification-output
          path: output/*.html
          if-no-files-found: warn
